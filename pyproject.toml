[project]
name = "selfref"
version = "0.1.0"
description = "Self-reference and brain foundation models: undergraduate research code"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.1",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/selfref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running simulation checks (deselect with -m 'not slow')"]
